<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Companion · Phase 0</title><style>
:root{font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:#27334c;background:#f6f8fc}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}
header{padding:18px 20px;background:white;border-bottom:1px solid #e5eaf3;display:flex;align-items:center;gap:12px}.badge{font-size:24px}h1{font-size:17px;margin:0}small{color:#71809c}.messages{flex:1;padding:22px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:88%;padding:13px 15px;border-radius:16px;background:white;box-shadow:0 2px 10px #30476c0c}.bubble.bot{align-self:flex-start;border-top-left-radius:5px}.bubble.user{align-self:flex-end;background:#e5edff;border-top-right-radius:5px}.notice{margin:auto 22px 0;padding:10px 12px;border-radius:10px;background:#fff4df;color:#735321;font-size:12px}.composer{padding:16px;display:flex;gap:8px;background:white;border-top:1px solid #e5eaf3}input{min-width:0;flex:1;border:1px solid #dce3ef;border-radius:12px;padding:12px;font:inherit}button{border:0;border-radius:12px;background:#647eeb;color:white;padding:0 17px;font-weight:600}
</style><body><header><span class="badge">🤖</span><div><h1>Your AI Companion</h1><small>Phase 0 prototype</small></div></header><main class="messages" id="messages"><div class="bubble bot">Hi! I’m your little desktop companion. This is a UI prototype; I can’t answer questions yet.</div></main><aside class="notice">Chat UI only · no AI service, account, or network calls are connected.</aside><form class="composer" id="form"><input id="message" autocomplete="off" placeholder="Type a message…" aria-label="Message"><button>Send</button></form><script>
const form=document.getElementById('form'),input=document.getElementById('message'),messages=document.getElementById('messages');form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;const bubble=document.createElement('div');bubble.className='bubble user';bubble.textContent=value;messages.appendChild(bubble);input.value='';messages.scrollTop=messages.scrollHeight;});
</script></body></html>
