<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden; background: transparent !important;
  }
  body { display: grid; place-items: center; user-select: none; }
  #companion {
    width: 100%; height: 100%; display: grid; place-items: center;
    background: transparent !important; border: 0 !important; outline: 0 !important;
    box-shadow: none !important; cursor: grab; -webkit-tap-highlight-color: transparent;
  }
  #companion:active { cursor: grabbing; }
  svg { width: 100%; height: 100%; overflow: visible; shape-rendering: crispEdges; }
  .sprite { transform-origin: 90px 104px; animation: bob 2.8s steps(4,end) infinite; filter: drop-shadow(0 4px 3px rgba(15, 35, 48, .28)); }
  .pixel-shadow { transform-origin: 90px 160px; animation: shadow 2.8s steps(4,end) infinite; }
  .eye { animation: blink 5s steps(1,end) infinite; }
  #companion.happy .sprite { animation: hop .48s steps(4,end) 2; }
  #companion:hover .sprite { filter: drop-shadow(0 4px 3px rgba(15, 35, 48, .28)) brightness(1.08); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity:.32; } 50% { transform:scaleX(.78); opacity:.2; } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform:scaleY(.12); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div id="companion" title="AI Companion — click to chat, right-click to quit" aria-label="AI Companion">
<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A tiny pixel-art robot companion">
  <defs>
    <filter id="spriteShadow" x="-60%" y="-60%" width="220%" height="240%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9e9f4"/><stop offset="1" stop-color="#65a9c7"/>
    </linearGradient>
  </defs>
  <!-- The only shadow is attached to the character; the window and page stay transparent. -->
  <ellipse class="pixel-shadow" cx="90" cy="158" rx="34" ry="5" fill="#142b3a" opacity=".3" filter="url(#spriteShadow)"/>
  <g class="sprite">
    <!-- antenna -->
    <rect x="87" y="15" width="6" height="13" fill="#426b83"/>
    <rect x="84" y="9" width="12" height="8" fill="#f6c96b"/>
    <rect x="87" y="11" width="6" height="4" fill="#fff0b6"/>
    <!-- ears / side fins -->
    <rect x="37" y="62" width="12" height="24" fill="#477d99"/>
    <rect x="131" y="62" width="12" height="24" fill="#477d99"/>
    <rect x="41" y="68" width="5" height="12" fill="#a8e0e9"/>
    <rect x="134" y="68" width="5" height="12" fill="#a8e0e9"/>
    <!-- head shell -->
    <rect x="52" y="31" width="76" height="8" fill="#426b83"/>
    <rect x="44" y="39" width="92" height="68" fill="#426b83"/>
    <rect x="49" y="35" width="82" height="68" fill="url(#shell)"/>
    <rect x="57" y="29" width="66" height="8" fill="#d5f5f6"/>
    <rect x="49" y="43" width="82" height="55" fill="url(#shell)"/>
    <!-- face panel -->
    <rect x="57" y="51" width="66" height="39" fill="#f2fbf5"/>
    <rect x="62" y="55" width="56" height="31" fill="#fffdf1"/>
    <!-- eyes -->
    <g class="eye" fill="#25445a">
      <rect x="72" y="64" width="8" height="10"/>
      <rect x="100" y="64" width="8" height="10"/>
    </g>
    <rect x="74" y="64" width="3" height="3" fill="#fff"/>
    <rect x="102" y="64" width="3" height="3" fill="#fff"/>
    <!-- tiny smile -->
    <rect x="85" y="78" width="10" height="3" fill="#d98d83"/>
    <rect x="82" y="75" width="3" height="3" fill="#d98d83"/>
    <rect x="95" y="75" width="3" height="3" fill="#d98d83"/>
    <!-- body -->
    <rect x="57" y="103" width="66" height="8" fill="#426b83"/>
    <rect x="49" y="111" width="82" height="34" fill="#477d99"/>
    <rect x="56" y="108" width="68" height="32" fill="#83c3d5"/>
    <rect x="69" y="115" width="42" height="18" fill="#eaf8ed"/>
    <rect x="84" y="120" width="12" height="8" fill="#f6c96b"/>
    <!-- arms -->
    <rect x="37" y="113" width="12" height="22" fill="#426b83"/>
    <rect x="131" y="113" width="12" height="22" fill="#426b83"/>
    <rect x="33" y="125" width="16" height="10" fill="#75b7cb"/>
    <rect x="131" y="125" width="16" height="10" fill="#75b7cb"/>
    <!-- feet -->
    <rect x="61" y="140" width="22" height="9" fill="#355d76"/>
    <rect x="97" y="140" width="22" height="9" fill="#355d76"/>
    <rect x="65" y="149" width="14" height="4" fill="#f6c96b"/>
    <rect x="101" y="149" width="14" height="4" fill="#f6c96b"/>
    <!-- shell highlights -->
    <rect x="53" y="45" width="4" height="40" fill="#d5f5f6" opacity=".8"/>
    <rect x="123" y="45" width="4" height="40" fill="#4e8da9" opacity=".65"/>
  </g>
</svg>
</div>
<script>
const companion = document.getElementById('companion');
let startX = 0, startY = 0, moved = false, pointerId = null;
function sendToApp(message) { if (window.ipc?.postMessage) window.ipc.postMessage(message); }
companion.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  startX = event.screenX; startY = event.screenY; moved = false; pointerId = event.pointerId;
  companion.setPointerCapture(event.pointerId);
});
companion.addEventListener('pointermove', (event) => {
  if (pointerId !== event.pointerId || !(event.buttons & 1)) return;
  const dx = event.screenX - startX, dy = event.screenY - startY;
  if (Math.abs(dx) + Math.abs(dy) < 3) return;
  moved = true; startX = event.screenX; startY = event.screenY;
  sendToApp(`drag:${dx},${dy}`);
});
companion.addEventListener('pointerup', () => { pointerId = null; });
companion.addEventListener('click', () => {
  if (moved) { moved = false; return; }
  companion.classList.remove('happy'); void companion.offsetWidth; companion.classList.add('happy');
  sendToApp('toggle-chat');
});
companion.addEventListener('contextmenu', (event) => {
  event.preventDefault(); event.stopPropagation(); sendToApp('quit');
});
window.companionReact = (state) => {
  companion.classList.toggle('happy', state === 'happy');
};
</script>
</body>
</html>
