<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Robot Companion</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#companion {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 155px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

#companion:active {
  cursor: grabbing;
}

svg {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  overflow: visible;
}

#callAction{display:none;position:absolute;bottom:5px;left:50%;transform:translateX(-50%);padding:6px 13px;border:1px solid #e45d69;border-radius:999px;background:#b83242;color:#fff;font:600 12px system-ui;cursor:pointer;white-space:nowrap;box-shadow:0 3px 12px #0006}
#callAction.visible{display:block}
/* ==================== PROCEDURAL ANIMATIONS ==================== */
.robot {
  transform-origin: 50% 50%;
  animation: rootFloat 3.8s ease-in-out infinite;
  filter: drop-shadow(0 6px 10px rgba(8, 14, 28, 0.45));
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

#companion:hover .robot {
  filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.35)) drop-shadow(0 6px 12px rgba(8, 14, 28, 0.55));
}

.robot-motion {
  transform-box: fill-box;
  transform-origin: center;
  animation: headBob 3.8s ease-in-out infinite;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.shoe{transform-box:fill-box;transform-origin:50% 0%;}
.shoe.fidget{animation:shoeFidget .62s cubic-bezier(.25,.7,.3,1) both;}
@keyframes shoeFidget{0%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-18px) rotate(-5deg)}42%{transform:translateY(4px) rotate(4deg)}67%{transform:translateY(-11px) rotate(-3deg)}86%{transform:translateY(2px) rotate(2deg)}}

.legs-group {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: legsSway 3.8s ease-in-out infinite;
  transition: transform 0.3s ease;
}

.shadow-oval {
  transform-origin: 100px 188px;
  animation: shadowPulse 3.8s ease-in-out infinite;
}

/* Natural idle blinking */
.eye-idle-rect {
  transform-box: fill-box;
  transform-origin: center;
  animation: idleBlink 4.2s ease-in-out infinite;
}

/* Headphone cyan LED ring glow */
.ear-ring {
  animation: ringPulse 2.2s ease-in-out infinite alternate;
}

.eye { transform-box: fill-box; transform-origin: center; animation: pastedBlink 5s infinite; }
.glow,.neon { animation: pastedPulse 2.4s ease-in-out infinite; }
@keyframes pastedBlink { 0%,94%,100% { transform:scaleY(1); } 97% { transform:scaleY(.08); } }
@keyframes pastedPulse { 0%,100% { opacity:.85; } 50% { opacity:1; } }

/* ==================== STATE VARIATIONS ==================== */
.art-face {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* 1. IDLE (Default) */
#companion.idle .face-idle {
  opacity: 1;
}

/* 2. HAPPY (Joyful Bouncing & ^_^ Eyes) */
#companion.happy .face-happy {
  opacity: 1;
}
#companion.happy .robot-motion {
  animation: happyHeadWiggle 0.45s ease-in-out infinite alternate;
}
#companion.happy .robot {
  animation: happyJump 0.48s ease-in-out 3;
}
#companion.happy .cheek-glow {
  opacity: 0.85;
}

/* 3. LIGHTNING / EXCITED (⚡ ⚡ Eyes from Reference) */
#companion.lightning .face-lightning {
  opacity: 1;
  animation: electricShimmer 0.2s ease-in-out infinite alternate;
}
#companion.lightning .robot-motion {
  transform: rotate(9deg) translateY(-3px);
}
#companion.lightning .neon {
  animation: ringPulseFast 0.3s ease-in-out infinite alternate;
}

/* 4. CURIOUS (Tilted Head from Reference Row 1) */
#companion.curious .face-curious {
  opacity: 1;
}
#companion.curious .robot-motion {
  transform: rotate(-12deg) translateY(-2px);
}
#companion.curious .legs-group {
  animation: curiousLegTilt 1.1s ease-in-out infinite alternate;
}

/* 5. GROOVE / MUSIC (Soundwaves & Head Sway) */
#companion.groove .face-groove {
  opacity: 1;
}
#companion.groove .robot-motion {
  animation: grooveSway 0.9s ease-in-out infinite alternate;
}
#companion.groove .robot {
  animation: grooveBounce 0.45s ease-in-out infinite alternate;
}
#companion.groove .neon {
  animation: ringPulseFast 0.45s ease-in-out infinite alternate;
}
#companion.groove .sound-waves {
  opacity: 1;
}

/* 6. LOVE (Cyan Heart Speech Bubble from Reference Row 3) */
#companion.love .face-love {
  opacity: 1;
}
#companion.love .robot-motion {
  transform: rotate(-7deg) translateY(-2px);
}
#companion.love .heart-bubble {
  opacity: 1;
  transform: scale(1) translateY(0);
}
#companion.love .cheek-glow {
  opacity: 0.95;
}

/* 7. SLEEPING (Closed Slits & Floating Zzz from Reference Row 2) */
#companion.sleeping .face-sleeping {
  opacity: 1;
}
#companion.sleeping .robot-motion {
  transform: rotate(5deg) translateY(4px);
}
#companion.sleeping .robot {
  animation: sleepBreathing 4.5s ease-in-out infinite;
}
#companion.sleeping .zzz-container {
  opacity: 1;
}

/* ==================== KEYFRAMES ==================== */
@keyframes rootFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@keyframes headBob {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(1.2deg) translateY(-1.5px); }
}

@keyframes legsSway {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(1.5px) scaleY(0.97); }
}

@keyframes shadowPulse {
  0%, 100% { transform: scale(1); opacity: 0.38; }
  50% { transform: scale(0.9); opacity: 0.24; }
}

@keyframes idleBlink {
  0%, 92%, 96%, 100% { transform: scaleY(1); }
  94% { transform: scaleY(0.08); }
}

@keyframes ringPulse {
  0% { filter: drop-shadow(0 0 2px #00f0ff) brightness(1); }
  100% { filter: drop-shadow(0 0 7px #00f0ff) brightness(1.4); }
}

@keyframes ringPulseFast {
  0% { filter: drop-shadow(0 0 3px #00f0ff) brightness(1.1); transform: scale(0.96); }
  100% { filter: drop-shadow(0 0 10px #00f0ff) brightness(1.7); transform: scale(1.08); }
}

@keyframes happyJump {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  32% { transform: translateY(-13px) rotate(-3deg); }
  64% { transform: translateY(-4px) rotate(2.5deg); }
}

@keyframes happyHeadWiggle {
  0% { transform: rotate(-3.5deg); }
  100% { transform: rotate(3.5deg); }
}

@keyframes electricShimmer {
  0% { filter: drop-shadow(0 0 3px #00f0ff) brightness(1); }
  100% { filter: drop-shadow(0 0 10px #e0faff) brightness(1.45); }
}

@keyframes grooveSway {
  0% { transform: rotate(-8deg) translateY(1.5px); }
  100% { transform: rotate(8deg) translateY(-1.5px); }
}

@keyframes grooveBounce {
  0% { transform: translateY(0); }
  100% { transform: translateY(-3px); }
}

@keyframes wavePopRight {
  0% { opacity: 0; transform: scale(0.7) translateX(0); }
  50% { opacity: 0.95; }
  100% { opacity: 0; transform: scale(1.3) translateX(8px); }
}

@keyframes wavePopLeft {
  0% { opacity: 0; transform: scale(0.7) translateX(0); }
  50% { opacity: 0.95; }
  100% { opacity: 0; transform: scale(1.3) translateX(-8px); }
}

.wave-r { animation: wavePopRight 1.1s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
.wave-l { animation: wavePopLeft 1.1s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }

@keyframes heartFloat {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-4px) scale(1.06); }
}

.heart-bubble {
  transform-origin: 156px 36px;
  animation: heartFloat 1.2s ease-in-out infinite alternate;
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes sleepBreathing {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(3px) scale(0.98); }
}

@keyframes zFloat1 {
  0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
  40% { opacity: 0.95; }
  100% { opacity: 0; transform: translate(12px, -20px) scale(1.1); }
}

@keyframes zFloat2 {
  0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
  40% { opacity: 0.95; }
  100% { opacity: 0; transform: translate(16px, -28px) scale(1.3); }
}

.z-char1 { animation: zFloat1 2.2s ease-out infinite; }
.z-char2 { animation: zFloat2 2.2s ease-out infinite 0.8s; }

#companion.lightning .robot-motion{animation:excitedTilt .35s ease-in-out infinite alternate}
#companion.curious .robot-motion{animation:curiousTilt 1.1s ease-in-out infinite alternate}
#companion.love .robot-motion{animation:loveTilt 1s ease-in-out infinite alternate}
#companion.sleeping .robot-motion{animation:sleepyNod 4.5s ease-in-out infinite}
#companion.groove .robot-motion{animation:grooveSway .9s ease-in-out infinite alternate}
#companion.lightning .neon{animation:ringPulseFast .3s ease-in-out infinite alternate}
#companion.curious .robot{filter:drop-shadow(0 0 8px rgba(90,210,255,.25))}
#companion.love .heart-bubble{opacity:1}
#companion.groove .sound-waves{opacity:1}
#companion.sleeping .zzz-container{opacity:1}
@keyframes excitedTilt{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-3px)}}
@keyframes curiousTilt{from{transform:rotate(-5deg)}to{transform:rotate(5deg) translateY(-2px)}}
@keyframes loveTilt{from{transform:rotate(-2deg)}to{transform:rotate(2deg) translateY(-2px)}}
@keyframes curiousLegTilt{from{transform:rotate(-2deg) translateY(0) scaleY(1)}to{transform:rotate(3deg) translateY(1.5px) scaleY(.97)}}
@keyframes sleepyNod{0%,100%{transform:rotate(2deg) translateY(0)}50%{transform:rotate(4deg) translateY(2px)}}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

    <rect x="353.8" y="143.8" width="47.4" height="126.4" rx="22.5" fill="none" stroke="#b4c8ff" stroke-width="1.4" opacity=".55"/>
    <rect x="352" y="155" width="33" height="104" rx="16" fill="#0f1654"/>
    <rect x="354" y="158" width="29" height="98" rx="14" fill="#1a2370" stroke="#2f44c8" stroke-width="1.5"/>

  <!-- outer glowing crescent fill on the earcups -->

    <path d="M25 164 C10 186 10 228 25 250 C21 232 21 182 25 164 Z" fill="#3d8bff" filter="url(#blurLine)" opacity=".9"/>

    <path d="M405 164 C420 186 420 228 405 250 C409 232 409 182 405 164 Z" fill="#3d8bff" filter="url(#blurLine)" opacity=".9"/>
    <path d="M405 164 C420 186 420 228 405 250 C409 232 409 182 405 164 Z" fill="url(#crescent)"/>

</div>
<button id="callAction" type="button" aria-label="End voice call">End call</button>

<script>
const companion = document.getElementById("companion");
const eyeL = document.getElementById("eyeL");
const eyeR = document.getElementById("eyeR");
const shoes = Array.from(document.querySelectorAll(".shoe"));

let startX = 0;
let startY = 0;
let pointerId = null;
let moved = false;
let suppressClick = false;
let autoResetTimer = null;
let idleFidgetTimer = null;
let audioCtx = null;

// The ordered emotional behavior cycle directly matching reference sprites
const BEHAVIORS = [
  "happy",     // ^_^ joyful hops
  "lightning", // ⚡ excited electric bolts
  "curious",   // tilted curious head
  "groove",    // 🎵 dancing groove + soundwaves
  "love",      // 💙 cyan heart bubble + blush
  "sleeping",  // 💤 sleepy slits + floating Zzz
  "idle"       // neutral breathing & blinking
];
let currentBehaviorIndex = -1;

// ================= PROCEDURAL AUDIO SYNTHESIZER =================
function playRobotChime(mood) {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (mood === 'happy') {
      // Cheerful ascending arpeggio
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, t);
      osc.frequency.exponentialRampToValueAtTime(659.25, t + 0.07);
      osc.frequency.exponentialRampToValueAtTime(783.99, t + 0.14);
      osc.frequency.exponentialRampToValueAtTime(1046.50, t + 0.22);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.start(t);
      osc.stop(t + 0.4);
    } else if (mood === 'lightning') {
      // Sci-fi electric zap chirp
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.linearRampToValueAtTime(920, t + 0.08);
      osc.frequency.linearRampToValueAtTime(620, t + 0.15);
      osc.frequency.linearRampToValueAtTime(1200, t + 0.24);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      osc.start(t);
      osc.stop(t + 0.32);
    } else if (mood === 'curious') {
      // Inquisitive two-tone rising chime
      osc.type = 'sine';
      osc.frequency.setValueAtTime(493.88, t);
      osc.frequency.exponentialRampToValueAtTime(739.99, t + 0.18);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
    } else if (mood === 'groove') {
      // Rhythmic music blip
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(329.63, t);
      osc.frequency.exponentialRampToValueAtTime(493.88, t + 0.1);
      osc.frequency.exponentialRampToValueAtTime(392.00, t + 0.2);
      gain.gain.setValueAtTime(0.11, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.start(t);
      osc.stop(t + 0.35);
    } else if (mood === 'love') {
      // Sweet high melodic tone
      osc.type = 'sine';
      osc.frequency.setValueAtTime(659.25, t);
      osc.frequency.exponentialRampToValueAtTime(987.77, t + 0.14);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      osc.start(t);
      osc.stop(t + 0.38);
    } else if (mood === 'sleeping') {
      // Soft gentle descending lullaby
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(220, t + 0.38);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.start(t);
      osc.stop(t + 0.45);
    } else {
      // Gentle idle blip
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, t);
      osc.frequency.exponentialRampToValueAtTime(783.99, t + 0.08);
      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      osc.start(t);
      osc.stop(t + 0.14);
    }
  } catch (err) {}
}

// IPC helper for Rust app
function sendToApp(message) {
  if (window.ipc?.postMessage) {
    window.ipc.postMessage(message);
  }
}

// ================= DRAG AND MOVE LOGIC =================
companion.addEventListener("pointerdown", event => {
  if (event.button === 1) { event.preventDefault(); sendToApp("toggle-call"); return; }
  if (event.button !== 0) return;

  startX = event.screenX;
  startY = event.screenY;
  moved = false;
  pointerId = event.pointerId;

  companion.setPointerCapture(event.pointerId);
});

companion.addEventListener("pointermove", event => {
  if (pointerId !== event.pointerId || !(event.buttons & 1)) return;

  const dx = event.screenX - startX;
  const dy = event.screenY - startY;

  if (Math.abs(dx) + Math.abs(dy) < 4) return;

  moved = true;
  startX = event.screenX;
  startY = event.screenY;

  sendToApp(`drag:${dx},${dy}`);
});

function finishPointer() {
  if (moved) {
    suppressClick = true;
    setTimeout(() => suppressClick = false, 280);
  }
  pointerId = null;
}

companion.addEventListener("pointerup", finishPointer);
companion.addEventListener("pointercancel", finishPointer);

// ================= AUTOMATIC BEHAVIOR CHANGE ON CLICK =================
// Click robot body: Cycles through behaviors automatically & toggles chat
companion.addEventListener("click", event => {
  if (event.button !== 0) return;
  if (suppressClick || moved) {
    suppressClick = false;
    moved = false;
    return;
  }

  // Advance to next behavior in sequence
  currentBehaviorIndex = (currentBehaviorIndex + 1) % BEHAVIORS.length;
  const nextMood = BEHAVIORS[currentBehaviorIndex];

  window.companionReact(nextMood);
  sendToApp("toggle-chat");
});

// Double click to toggle sleeping mode immediately
companion.addEventListener("dblclick", () => {
  if (companion.classList.contains("sleeping")) {
    window.companionReact("idle");
  } else {
    window.companionReact("sleeping");
  }
});

const callAction = document.getElementById("callAction");
window.__setCallActive = active => callAction.classList.toggle("visible", !!active);
callAction.addEventListener("click", event => { event.stopPropagation(); sendToApp("toggle-call"); });

// Right click context menu to quit
companion.addEventListener("contextmenu", event => {
  event.preventDefault();
  event.stopPropagation();
  sendToApp("quit");
});

// ================= MOUSE CURSOR EYE TRACKING =================
window.addEventListener("pointermove", (e) => {
  if (!companion.classList.contains("idle")) return;

  const rect = companion.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const dx = (e.clientX - centerX) / (window.innerWidth / 2 || 1);
  const dy = (e.clientY - centerY) / (window.innerHeight / 2 || 1);

  const clampX = Math.max(-4, Math.min(4, dx * 4));
  const clampY = Math.max(-3, Math.min(3, dy * 3));

  if (eyeL && eyeR) {
    eyeL.style.translate = `${clampX}px ${clampY}px`;
    eyeR.style.translate = `${clampX}px ${clampY}px`;
  }
});

// ================= SPONTANEOUS IDLE FIDGETS =================
function resetIdleFidget() {
  if (idleFidgetTimer) clearTimeout(idleFidgetTimer);
  idleFidgetTimer = setTimeout(() => {
    if (companion.classList.contains("idle")) {
      const fidgets = ["curious", "groove", "happy"];
      const randomFidget = fidgets[Math.floor(Math.random() * fidgets.length)];
      window.companionReact(randomFidget);
    } else {
      resetIdleFidget();
    }
  }, 16000 + Math.random() * 8000);
}

function scheduleShoeFidget() {
  const delay = 1800 + Math.random() * 4400;
  setTimeout(() => {
    if (!document.hidden && !companion.classList.contains("sleeping") && shoes.length) {
      const shoe = shoes[Math.floor(Math.random() * shoes.length)];
      shoe.classList.remove("fidget");
      void shoe.getBoundingClientRect();
      shoe.classList.add("fidget");
      setTimeout(() => shoe.classList.remove("fidget"), 700);
    }
    scheduleShoeFidget();
  }, delay);
}
// ================= GLOBAL DISPATCHER =================
window.companionReact = (mood) => {
  const allMoods = [
    "idle",
    "happy",
    "lightning",
    "curious",
    "groove",
    "love",
    "sleeping"
  ];

  if (!allMoods.includes(mood)) mood = "idle";

  companion.classList.remove(...allMoods);
  companion.classList.add(mood);

  if (eyeL && eyeR) {
    eyeL.style.translate = "";
    eyeR.style.translate = "";
  }

  playRobotChime(mood);

  if (autoResetTimer) clearTimeout(autoResetTimer);

  // Momentary expressions return to idle after 3.2s
  if (mood !== "idle" && mood !== "sleeping") {
    autoResetTimer = setTimeout(() => {
      if (companion.classList.contains(mood)) {
        window.companionReact("idle");
      }
    }, 3200);
  }

  resetIdleFidget();
};

// Keyboard testing shortcuts: 1-7
window.addEventListener("keydown", (e) => {
  if (e.key === "1") window.companionReact("idle");
  if (e.key === "2") window.companionReact("happy");
  if (e.key === "3") window.companionReact("lightning");
  if (e.key === "4") window.companionReact("curious");
  if (e.key === "5") window.companionReact("groove");
  if (e.key === "6") window.companionReact("love");
  if (e.key === "7") window.companionReact("sleeping");
});

// Initialize in idle
window.companionReact("idle");
scheduleShoeFidget();
</script>

</body>
</html>
