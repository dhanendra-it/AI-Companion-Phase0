<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aalu Personal Toolbar</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#11131a;color:#eef0f6}
*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(ellipse at top left,#252b3b,#11131a 62%);min-height:100vh}
.shell{max-width:760px;margin:auto;border:1px solid #343a4b;border-radius:22px;background:#171a23eF;box-shadow:0 24px 70px #0008;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid #303544}
.brand{display:flex;gap:12px;align-items:center}.orb{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#6ce0d0,#6878ff);display:grid;place-items:center;color:#111;font-weight:900}
h1{font-size:16px;margin:0}small{color:#8f98ad}.close{border:0;background:#252a36;color:#aeb6c8;border-radius:9px;padding:7px 11px;cursor:pointer}
.tabs{display:flex;gap:7px;padding:13px 16px;overflow:auto;border-bottom:1px solid #303544}
.tab{white-space:nowrap;border:1px solid transparent;background:transparent;color:#9da6bb;padding:8px 12px;border-radius:10px;cursor:pointer}.tab.active{background:#293044;color:#fff;border-color:#48516b}
main{padding:17px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input,.modal input,.modal select{background:#10131b;border:1px solid #363d50;color:#fff;padding:10px 12px;border-radius:10px;min-width:0;flex:1;outline:none}
button.primary{background:#7c8cff;color:#101321;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.item{position:relative;border:1px solid #303748;border-radius:14px;padding:13px;background:linear-gradient(145deg,#202635,#191e29);min-height:90px;cursor:pointer}
.item:hover{border-color:#7585ff;transform:translateY(-1px)}.item .ico{font-size:21px}.item strong{display:block;margin-top:9px;font-size:13px}.item small{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#7f899f;cursor:pointer;font-size:16px}
.empty{text-align:center;padding:42px 15px;color:#8f98ad;border:1px dashed #394155;border-radius:14px}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{width:min(420px,100%);background:#1b202c;border:1px solid #41495d;border-radius:17px;padding:18px;display:grid;gap:10px}.dialog h2{margin:0 0 4px;font-size:16px}.dialog .actions{display:flex;justify-content:flex-end;gap:8px}.secondary{background:#2b3242;color:#dce1ed;border:0;border-radius:10px;padding:10px 13px;cursor:pointer}
footer{padding:0 19px 16px;color:#778198;font-size:11px}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="orb">A</div><div><h1>Personal Toolbar</h1><small>Your workspace, one tap away</small></div></div><button class="close" id="close">✕</button></header>
<nav class="tabs" id="tabs"></nav>
<main><div class="toolbar"><input id="search" placeholder="Search this section…"><button class="primary" id="add">＋ Add</button></div><section class="grid" id="items"></section></main>
<footer>Saved on this PC · Your shortcuts and layout stay local to this device</footer>
</div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add item</h2><input id="name" placeholder="Name"><input id="target" placeholder="URL, app path, or command"><select id="kind"><option value="url">Website / URL</option><option value="app">Desktop app path</option><option value="text">Command (save only)</option></select><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save item</button></div></div></div>
<script>
const sections=["Shortcuts","Commands","Folders","Bookmarks","Window Manager","Aalu"];
const icons={"Shortcuts":"↗","Commands":"⌘","Folders":"▣","Bookmarks":"★","Window Manager":"▱","Aalu":"✦"};
const key="aalu.personalToolbar.v1";let active="Shortcuts",data=load();
function load(){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch{return {}}}
function persist(){localStorage.setItem(key,JSON.stringify(data))}
const tabs=document.getElementById("tabs"),items=document.getElementById("items"),search=document.getElementById("search");
function renderTabs(){tabs.innerHTML="";sections.forEach(s=>{const b=document.createElement("button");b.className="tab"+(s===active?" active":"");b.textContent=icons[s]+"  "+s;b.onclick=()=>{active=s;render()};tabs.append(b)})}
function render(){renderTabs();items.innerHTML="";let list=(data[active]||[]).filter(x=>(x.name+" "+x.target).toLowerCase().includes(search.value.toLowerCase()));
if(active==="Window Manager"||active==="Aalu"){const defaults=active==="Window Manager"?[["▱","Show / hide Aalu","toggle-robot"],["◫","Open chat","open-chat"],["◷","Open scheduler","open-scheduler"]]:[["✦","Meet Aalu","toggle-robot"],["⚙","Open Aalu chat","open-chat"]];defaults.forEach(([ico,n,cmd])=>items.append(makeCard({name:n,target:cmd,kind:"action",icon:ico},false)))}
list.forEach((x,i)=>items.append(makeCard(x,true,i)));
if(!items.children.length){const e=document.createElement("div");e.className="empty";e.style.gridColumn="1/-1";e.textContent="Nothing here yet. Click ＋ Add to create your first item.";items.append(e)}}
function makeCard(x,removable,index){const el=document.createElement("article");el.className="item";const ico=document.createElement("div");ico.className="ico";ico.textContent=x.icon||icons[active]||"•";const strong=document.createElement("strong");strong.textContent=x.name;const small=document.createElement("small");small.textContent=x.target||active;el.append(ico,strong,small);if(removable){const del=document.createElement("button");del.className="del";del.textContent="×";del.title="Delete";del.onclick=e=>{e.stopPropagation();data[active].splice(index,1);persist();render()};el.append(del)}el.onclick=()=>activate(x);return el}
function activate(x){if(x.kind==="action"){window.ipc.postMessage(x.target);return}if(x.kind==="text"){navigator.clipboard?.writeText(x.target);return}if(x.kind==="app"){window.ipc.postMessage(JSON.stringify({t:"launch-app",target:x.target}));return}if(x.kind==="url"){let u=x.target;if(!/^https?:\/\//i.test(u))u="https://"+u;window.ipc.postMessage(JSON.stringify({t:"open-url",target:u}));}}
document.getElementById("add").onclick=()=>{document.getElementById("modal").classList.add("open");document.getElementById("name").value="";document.getElementById("target").value="";document.getElementById("kind").value=active==="Commands"?"text":active==="Shortcuts"?"url":"text";document.getElementById("name").focus()};
document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("save").onclick=()=>{const name=document.getElementById("name").value.trim(),target=document.getElementById("target").value.trim(),kind=document.getElementById("kind").value;if(!name||!target)return;data[active]=data[active]||[];data[active].push({name,target,kind});persist();document.getElementById("modal").classList.remove("open");render()};
document.getElementById("close").onclick=()=>window.ipc.postMessage("close");
search.oninput=render;render();
</script>
</body></html>
