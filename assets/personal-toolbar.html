<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aalu Personal Toolbar</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#f1f2f6}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
.panel{position:absolute;inset:22px;border-radius:56px;background:linear-gradient(160deg,rgba(54,56,66,.92),rgba(27,28,34,.94));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 20px rgba(0,0,0,.4);overflow:hidden}
.center{position:absolute;left:50%;top:50%;width:39%;height:39%;transform:translate(-50%,-50%);border-radius:38px;background:rgba(18,18,20,.55);display:grid;place-items:center;text-align:center;font-size:14px;font-weight:600;cursor:pointer;padding:10px}
.center small{display:block;margin-top:6px;font-size:11px;font-weight:500;color:#9a9eaa}
.slot{position:absolute;width:98px;transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.slot:hover .ico{transform:scale(1.1);background:rgba(255,255,255,.1)}
.ico{position:relative;width:48px;height:48px;margin:0 auto;border-radius:14px;display:grid;place-items:center;transition:transform .12s,background .12s;font-size:22px}
.ico svg{width:34px;height:34px;fill:none;stroke:#ecedf2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico .chev{position:absolute;right:-4px;bottom:2px;font-size:12px;color:#b9bcc7}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.35)}
.badge svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.lbl{margin-top:6px;font-size:11.5px;font-weight:600;color:#e7e8ee;text-shadow:0 1px 3px rgba(0,0,0,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sublbl{font-size:10px;color:#5eead4;font-weight:700;margin-top:2px;white-space:nowrap}
.sublbl.off{color:#9aa3b8}
.toggle-on{background:linear-gradient(135deg,#0e9f6e,#057a55)!important;color:#fff!important;box-shadow:0 0 14px rgba(14,159,110,0.55)!important}
.toggle-off{background:linear-gradient(135deg,#4b5266,#343a4a)!important;color:#fff!important}
.add .ico{border:1.5px dashed rgba(255,255,255,.28);font-size:24px;color:#c4c7d2}
.modal{display:none;position:absolute;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:24px;z-index:5}.modal.open{display:flex}
.dialog{width:100%;background:#1d1f27;border:1px solid #43485a;border-radius:20px;padding:18px;display:grid;gap:10px}.dialog h2{margin:0 0 2px;font-size:15px}
.dialog input,.dialog select{background:#10121a;border:1px solid #393f52;color:#fff;padding:9px 11px;border-radius:10px;outline:none;font-size:13px;user-select:text}
.pickrow{display:none;gap:8px}.pickrow button{flex:1;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:12px;background:#2b3242;color:#dce1ed}.pickrow button:hover{background:#37405a}
.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:700}
.primary{background:#7c8cff;color:#101321}.secondary{background:#2b3242;color:#dce1ed}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:78%;padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:#171a23;color:#e9edf5;font-size:11px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:8}.toast.show{opacity:1}.toast.error{border-color:#a94b58;color:#ffd8dc}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="center" id="center"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add item</h2><input id="name" placeholder="Name"><input id="target" placeholder="URL, app path, or text"><div class="pickrow" id="pickRow"><button type="button" id="pickFile">Browse file / app</button><button type="button" id="pickFolder">Browse folder</button></div><select id="kind"><option value="url">Website / URL</option><option value="app">Desktop app / shortcut</option><option value="folder">Folder</option><option value="text">Text (copy to clipboard)</option></select><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div></div></div>
</div>
<script>
// Slot centres as % of the 500x500 panel, clockwise from top-left (matches the reference layout).
const SLOTS=[[17,21],[43,15],[70,15],[85,37],[85,64],[70,85],[43,85],[17,79],[15,50]];
const SVG={
 Commands:'<path d="M4 24 10 8 16 24M6.4 18h7.2"/><path d="M21 7h5M23.5 7v18M21 25h5"/>',
 Shortcuts:'<path d="M15 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/><path d="M26 4v5M23.5 6.5h5"/>',
 Folders:'<path d="M4 10a2 2 0 0 1 2-2h6l3 3h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>',
 "Window Manager":'<rect x="5" y="5" width="9" height="9" rx="2"/><rect x="18" y="5" width="9" height="9" rx="2"/><rect x="5" y="18" width="9" height="9" rx="2"/><rect x="18" y="18" width="9" height="9" rx="2"/>',
 Bookmarks:'<circle cx="16" cy="16" r="11"/><ellipse cx="16" cy="16" rx="5" ry="11"/><path d="M5 16h22M7 10h18M7 22h18"/>',
 Settings:'<circle cx="16" cy="16" r="4"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8"/>'
};
// Ring order: [section key, label]. "Apps" slots (4-7) are filled from the user's pinned apps.
const TOP=[["Commands","Text Snippets"],["Shortcuts","Shortcuts"],["Folders","Folders"],["Bookmarks","Bookmarks"]];
const ICONS={
 robot:'<rect x="7" y="8" width="18" height="16" rx="5"/><path d="M16 4v4M12 15h.01M20 15h.01M12 20h8M4 13v6m24-6v6"/>',
 chat:'<path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h15A3.5 3.5 0 0 1 27 6.5v11a3.5 3.5 0 0 1-3.5 3.5H13l-7 5v-5.7a3.5 3.5 0 0 1-1-2.8z"/><path d="M10 10h12M10 15h8"/>',
 calendar:'<rect x="4" y="6" width="24" height="22" rx="3"/><path d="M10 3v6m12-6v6M4 12h24M10 18h4m4 0h4m-12 5h4"/>',
 check:'<path d="m6 16 6 6L26 8"/>',
 eyeOff:'<path d="m3 3 26 26M13.6 13.6a3.4 3.4 0 0 0 4.8 4.8"/><path d="M10.6 6.8A15 15 0 0 1 16 6c7 0 11 7 11 7a18 18 0 0 1-4 4.6M6.2 9.2C3.8 11 2 13 2 13s4 7 14 7c1.1 0 2.1-.1 3-.4"/>',
 plus:'<path d="M16 6v20M6 16h20"/>'
};
const WM=[
  {icon:"robot",name:"Show / hide Aalu",target:"toggle-robot",kind:"action"},
  {icon:"chat",name:"Open chat",target:"open-chat",kind:"action"},
  {icon:"calendar",name:"Open scheduler",target:"open-scheduler",kind:"action"}
];
const key="aalu.personalToolbar.v1";
const settingsKey="aalu.settings.v1";
let data=load(),settings=loadSettings(),view=null,page=0,pendingPickMode="app"; // view=null -> ring, else section key
const panel=document.getElementById("panel"),center=document.getElementById("center"),toast=document.getElementById("toast");
let toastTimer=null;
function notify(message,isError=false){toast.textContent=message;toast.className="toast show"+(isError?" error":"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className="toast",2600)}
function sendNative(message){try{if(!window.ipc||typeof window.ipc.postMessage!=="function")throw new Error("Native toolbar bridge is unavailable");window.ipc.postMessage(typeof message==="string"?message:JSON.stringify(message));return true}catch(error){notify(error.message||"Could not send action to Aalu",true);return false}}

function loadSettings(){try{const s=JSON.parse(localStorage.getItem(settingsKey)||"{}");return{hideOnCapture:s.hideOnCapture!==false}}catch(e){return{hideOnCapture:true}}}
function persistSettings(){try{localStorage.setItem(settingsKey,JSON.stringify(settings))}catch(error){notify("Could not save settings in this WebView",true)}sendNative({t:"set-setting",hide_on_capture:settings.hideOnCapture})}
window.__setSettings=function(s){if(s&&typeof s.hideOnCapture==="boolean"){settings.hideOnCapture=s.hideOnCapture;try{localStorage.setItem(settingsKey,JSON.stringify(settings))}catch(e){}render()}};

function load(){try{const value=JSON.parse(localStorage.getItem(key)||"{}");return value&&typeof value==="object"&&!Array.isArray(value)?value:{}}catch{return{}}}
function persist(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(error){notify("Could not save toolbar items. Check WebView storage permissions.",true);return false}}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function clear(){panel.querySelectorAll(".slot").forEach(e=>e.remove())}
function slot(i,html,onclick,extra){const[x,y]=SLOTS[i];const d=document.createElement("div");d.className="slot"+(extra||"");d.style.left=x+"%";d.style.top=y+"%";d.innerHTML=html;d.onclick=onclick;panel.append(d);return d}
function sectionSlot(i,k,label){slot(i,'<div class="ico"><svg viewBox="0 0 32 32">'+SVG[k]+'</svg><span class="chev">›</span></div><div class="lbl">'+label+'</div>',()=>{view=k;page=0;render()})}
function badge(x){const el=document.createElement("div");el.className="badge";if(x.icon&&ICONS[x.icon]){el.style.background="rgba(255,255,255,.1)";el.innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true">'+ICONS[x.icon]+'</svg>'}else{const h=hue(x.name);el.style.background="linear-gradient(145deg,hsl("+h+" 70% 58%),hsl("+(h+40)+" 70% 38%))";el.textContent=(x.name[0]||"?").toUpperCase()}return el}
function itemSlot(i,x,removable,idx,listKey){const d=slot(i,'<div class="ico"></div><div class="lbl"></div>',()=>activate(x));d.querySelector(".ico").append(badge(x));d.querySelector(".lbl").textContent=x.name;
 if(removable)d.oncontextmenu=e=>{e.preventDefault();if(confirm('Remove "'+x.name+'"?')){data[listKey].splice(idx,1);persist();render()}}}
function addSlot(i,listKey,label){slot(i,'<div class="ico"><svg viewBox="0 0 32 32">'+ICONS.plus+'</svg></div><div class="lbl">'+label+'</div>',()=>openModal(listKey),' add')}

function render(){clear();
 if(view===null){
  center.innerHTML="Close<small>Esc or click</small>";
  TOP.forEach(([k,l],n)=>sectionSlot(n,k,l));
  sectionSlot(8,"Settings","Settings");
  const apps=data.Apps||[];
  for(let n=0;n<4;n++){const a=apps[n];if(a)itemSlot(4+n,a,true,n,"Apps");else if(n===apps.length)addSlot(4+n,"Apps","Add app")}
 }else if(view==="Settings"){
  center.innerHTML="Settings<small>Click option to toggle · Back</small>";
  const isShow=settings.hideOnCapture===false;
  slot(0,
    `<div class="ico"><div class="badge ${isShow?'toggle-on':'toggle-off'}"><svg viewBox="0 0 32 32">${isShow?ICONS.check:ICONS.eyeOff}</svg></div></div>`+
    `<div class="lbl">Show in SS</div>`+
    `<div class="sublbl ${isShow?'':'off'}">${isShow?'ON · visible':'OFF · hidden'}</div>`,
    ()=>{
      settings.hideOnCapture=isShow;
      persistSettings();
      render();
    }
  );
  sectionSlot(2,"Window Manager","Window Manager");
 }else{
  const saved=Array.isArray(data[view])?data[view]:[];
  const list=(view==="Window Manager"?WM:[]).concat(saved);
  const per=8,pages=Math.max(1,Math.ceil((list.length+1)/per));
  if(page>=pages)page=pages-1;
  center.innerHTML=view+"<small>"+(pages>1?"Page "+(page+1)+"/"+pages+" · scroll · ":"")+"click to go back</small>";
  const base=(view==="Window Manager"?WM.length:0);
  const slice=list.slice(page*per,page*per+per);
  slice.forEach((x,n)=>{const gi=page*per+n;itemSlot(n,x,x.kind!=="action"&&x.kind!=="settings",gi-base,view)});
  if(slice.length<per&&view!=="Window Manager")addSlot(slice.length,view,"Add");
 }}

function activate(x){
 if(x.target==="settings"||x.kind==="settings"){view="Settings";page=0;render();return}
 if(x.kind==="action"){sendNative(x.target);return}
 if(x.kind==="text"){sendNative({t:"copy-text",target:x.target});return}
 if(x.kind==="app"||x.kind==="folder"){sendNative({t:"launch-app",target:x.target});return}
 if(x.kind==="url"){let u=x.target.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;try{new URL(u)}catch{notify("Enter a valid website address",true);return}sendNative({t:"open-url",target:u})}}

let addTo=null;
function openModal(listKey){addTo=listKey;const k=document.getElementById("kind");document.getElementById("name").value="";document.getElementById("target").value="";
 k.value=listKey==="Apps"||listKey==="Shortcuts"?"app":listKey==="Folders"?"folder":listKey==="Commands"?"text":"url";syncPick();document.getElementById("modal").classList.add("open");document.getElementById("name").focus()}
function syncPick(){const kind=document.getElementById("kind").value;document.getElementById("pickRow").style.display=kind==="app"||kind==="folder"?"flex":"none";document.getElementById("pickFile").style.display=kind==="folder"?"none":"block";document.getElementById("pickFolder").style.display=kind==="folder"?"block":"none"}
document.getElementById("kind").onchange=syncPick;
document.getElementById("pickFile").onclick=()=>{pendingPickMode="app";sendNative({t:"pick",mode:"file"})};
document.getElementById("pickFolder").onclick=()=>{pendingPickMode="folder";sendNative({t:"pick",mode:"folder"})};
window.__picked=p=>{if(!p)return;document.getElementById("target").value=p;document.getElementById("kind").value=pendingPickMode;syncPick();const n=document.getElementById("name");if(!n.value.trim()){const base=p.replace(/[\\/]+$/,"").split(/[\\/]/).pop()||p;n.value=pendingPickMode==="app"?base.replace(/\.[^.]+$/,""):base}notify("Selected "+p.split(/[\\/]/).pop())};
window.__actionResult=(ok,message,closeAfter)=>{notify(message|| (ok?"Done":"Action failed"),!ok);if(ok&&closeAfter)setTimeout(()=>sendNative("close"),650)};
document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("save").onclick=()=>{const name=document.getElementById("name").value.trim(),target=document.getElementById("target").value.trim(),kind=document.getElementById("kind").value;if(!name||!target){notify("Enter both a name and a target",true);return}if(kind==="url"){let url=target;if(!/^https?:\/\//i.test(url))url="https://"+url;try{new URL(url)}catch{notify("Enter a valid website address",true);return}}if(!Array.isArray(data[addTo]))data[addTo]=[];data[addTo].push({name,target,kind});if(!persist())return;document.getElementById("modal").classList.remove("open");render();notify("Added "+name)};
center.onclick=()=>{if(view===null)window.ipc.postMessage("close");else{view=null;render()}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("modal").classList.contains("open"))document.getElementById("modal").classList.remove("open");else if(view!==null){view=null;render()}else window.ipc.postMessage("close")}});
// Click on empty space (anything that is not a slot, the centre, or the add dialog) closes the toolbar.
document.addEventListener("click",e=>{if(document.getElementById("modal").classList.contains("open"))return;if(e.target.closest&&e.target.closest(".slot,#center,#modal"))return;window.ipc.postMessage("close")});
document.addEventListener("wheel",e=>{if(view===null)return;page=Math.max(0,page+(e.deltaY>0?1:-1));render()},{passive:true});
window.__reset=()=>{view=null;page=0;document.getElementById("modal").classList.remove("open");render()};

// Initial sync with backend
try{sendNative({t:"set-setting",hide_on_capture:settings.hideOnCapture})}catch(e){}
render();
</script>
</body></html>
