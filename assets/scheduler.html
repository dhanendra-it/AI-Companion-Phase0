<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aalu — Daily Scheduler</title>
<style>
:root {
  font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e4e8ee;
  --line-strong: #d3dae3;
  --ink: #18212f;
  --ink-2: #3b4757;
  --muted: #6a7788;
  --accent: #0f9d8a;
  --accent-strong: #0b8473;
  --accent-soft: #e5f5f2;
  --accent-line: #b7e3db;
  --danger: #d6455a;
  --danger-soft: #fdecef;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-md: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 18px rgba(16, 24, 40, .07);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  user-select: none;
}

/* ---------- Title bar ---------- */
.window-bar {
  height: 60px;
  flex: none;
  padding: 0 10px 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand { height: 100%; display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: default; }
.badge {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center;
  color: #fff; background: linear-gradient(135deg, #17b5a0, #0b8473);
  border-radius: 10px; box-shadow: 0 2px 8px rgba(15, 157, 138, .30);
}
.badge svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.brand-copy { min-width: 0; }
.brand h1 { font-size: 14px; line-height: 1.25; font-weight: 650; color: var(--ink); letter-spacing: -.005em; }
.brand small { display: block; color: var(--muted); font-size: 11px; line-height: 1.2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.toolbar { height: 100%; display: flex; align-items: center; gap: 2px; flex: none; }
.window-control {
  border: 0; background: transparent; color: var(--muted);
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; cursor: pointer;
  transition: background .15s, color .15s;
}
.window-control:hover { background: #eef1f5; color: var(--ink); }
.window-control.close:hover { background: var(--danger); color: #fff; }
.window-control svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Segmented tabs (live inside the title bar) */
.tabs { flex: none; display: flex; gap: 2px; padding: 3px; background: #eef1f5; border-radius: 11px; }
.tab {
  border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 6px 16px; border-radius: 8px; cursor: pointer;
  transition: background .15s, color .15s, box-shadow .15s;
}
.tab:hover { color: var(--ink); }
.tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(16, 24, 40, .12); }
.view-hidden { display: none !important; }

/* ---------- Shared controls ---------- */
select, input[type="text"], input[type="time"] {
  font: inherit; font-size: 13px; color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 9px;
  padding: 7px 11px; background: var(--surface); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 157, 138, .16); }
.btn-sm {
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  border-radius: 9px; padding: 6px 11px; font: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; box-shadow: var(--shadow-sm); transition: all .15s;
}
.btn-sm:hover { background: var(--surface-2); border-color: #b9c3d0; color: var(--ink); }
.btn-sm.danger { color: var(--danger); }
.btn-sm.danger:hover { background: var(--danger-soft); border-color: #f1b4be; }
.btn-add {
  border: 0; border-radius: 9px; background: var(--accent); color: #fff;
  padding: 7px 16px; font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer; flex: none;
  box-shadow: 0 1px 2px rgba(15, 157, 138, .35); transition: background .15s;
}
.btn-add:hover { background: var(--accent-strong); }

.block-time {
  font-size: 12px; font-weight: 650; color: var(--ink-2);
  background: #eef1f5; border-radius: 7px; padding: 2px 8px;
  letter-spacing: .02em; flex: none; font-variant-numeric: tabular-nums;
}
.block-text { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
.empty-state { margin: auto; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; padding: 24px; max-width: 320px; }
.today-badge {
  font-size: 9.5px; font-weight: 750; letter-spacing: .07em; color: var(--accent-strong);
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  padding: 1px 7px; border-radius: 999px; text-transform: uppercase;
}

/* ---------- Checklist (main view) ---------- */
.check-view { flex: 1; min-height: 0; padding: 18px 22px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }

.check-head {
  flex: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 18px 14px; box-shadow: var(--shadow-md);
  display: flex; flex-direction: column; gap: 14px;
}
.head-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.head-title { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.date-label { font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.head-sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
#checkCount::before { content: '·'; margin-right: 6px; color: #b3bdca; }
#checkCount:empty::before { content: none; }
.head-sub b { color: var(--accent-strong); font-weight: 700; }

.date-nav { display: flex; align-items: center; gap: 6px; flex: none; }
.nav-btn {
  height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink-2); border-radius: 9px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow-sm); transition: all .15s;
}
.nav-btn:hover { background: var(--surface-2); border-color: #b9c3d0; color: var(--ink); }
.nav-btn.icon { font-size: 17px; line-height: 1; padding: 0 0 2px; }

.progress-wrap { display: flex; align-items: center; gap: 12px; }
.progress-bar { flex: 1; height: 8px; background: #edf0f4; border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #17b5a0, #0f9d8a); transition: width .35s cubic-bezier(.3, .8, .3, 1); }
.progress-pct { font-size: 12px; font-weight: 700; color: var(--ink-2); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

.history { flex: none; display: flex; gap: 8px; }
.hist-chip {
  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
  padding: 7px 2px 6px; font: inherit; font-size: 11px; line-height: 1.35; color: var(--muted);
  text-align: center; cursor: pointer; box-shadow: var(--shadow-sm); transition: all .15s;
}
.hist-chip b { display: block; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.hist-chip:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.hist-chip.active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-strong); }
.hist-chip.active b { color: var(--accent-strong); }
.hist-chip.full { color: var(--accent-strong); }

.check-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 6px 2px; }
.check-list::-webkit-scrollbar { width: 8px; }
.check-list::-webkit-scrollbar-thumb { background: #d3dae3; border-radius: 999px; border: 2px solid var(--bg); }
.check-list::-webkit-scrollbar-thumb:hover { background: #b9c3d0; }
.check-row {
  flex: none; display: flex; align-items: center; gap: 14px; padding: 13px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow-sm); cursor: pointer;
  transition: border-color .15s, box-shadow .15s, background .2s, transform .1s;
}
.check-row:hover { border-color: var(--line-strong); box-shadow: var(--shadow-md); }
.check-row:active { transform: scale(.998); }
.check-box {
  width: 22px; height: 22px; flex: none; border: 2px solid #c3ccd8; border-radius: 50%;
  display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 800; line-height: 1;
  transition: all .18s cubic-bezier(.3, 1.5, .5, 1);
}
.check-row:hover .check-box { border-color: var(--accent); }
.check-row .block-time { background: transparent; padding: 0; min-width: 44px; font-size: 13px; color: var(--muted); }
.check-row .block-text { font-size: 14px; font-weight: 550; }
.check-row.done { background: var(--surface-2); }
.check-row.done .check-box { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.05); }
.check-row.done .block-text { color: #94a0b0; text-decoration: line-through; text-decoration-color: #c3ccd8; }
.check-row.done .block-time { opacity: .6; }
.check-row.next { border-color: var(--accent-line); background: linear-gradient(90deg, var(--accent-soft), var(--surface) 55%); box-shadow: 0 0 0 1px var(--accent-line), var(--shadow-sm); }
.next-tag { font-size: 9.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-strong); background: #fff; border: 1px solid var(--accent-line); padding: 1px 8px; border-radius: 999px; flex: none; }

/* ---------- Timetable tab ---------- */
.main-content { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; padding: 18px 22px 14px; }
.pane {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden;
}
.pane-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pane-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.template-picker-row { display: flex; gap: 8px; align-items: center; }
.template-select { flex: 1; min-width: 0; font-weight: 600; }
.btn-group { display: flex; gap: 6px; }
.pane-title { white-space: nowrap; }
.pane-title-row:has(.btn-group) { flex-direction: column; align-items: stretch; gap: 10px; }
.pane-title-row:has(.btn-group) .btn-group .btn-sm { flex: 1; padding: 6px 4px; }
.block-list-container, .week-rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
.block-list-container { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.block-list-container::-webkit-scrollbar, .week-rows::-webkit-scrollbar { width: 6px; }
.block-list-container::-webkit-scrollbar-thumb, .week-rows::-webkit-scrollbar-thumb { background: #d3dae3; border-radius: 3px; }
.block-row, .day-card {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 11px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-sm);
  transition: border-color .15s;
}
.block-row:hover, .day-card:hover { border-color: var(--line-strong); }
.block-delete { border: 0; background: transparent; color: #9aa6b5; cursor: pointer; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; }
.block-delete:hover { background: var(--danger-soft); color: var(--danger); }
.add-block-row { display: flex; gap: 6px; flex: none; align-items: center; }
.add-block-row input[type="time"] { width: 128px; flex: none; }
.add-block-row input[type="text"] { flex: 1; min-width: 0; }
.day-card.today { border-color: var(--accent-line); background: var(--accent-soft); }
.day-label-group { display: flex; align-items: center; gap: 6px; min-width: 84px; }
.day-name { font-size: 13px; font-weight: 650; color: var(--ink); }
.day-select { flex: 1; min-width: 0; font-size: 12.5px; padding: 5px 9px; }

/* ---------- Footer ---------- */
.footer-bar {
  height: 50px; flex: none; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 22px; display: flex; align-items: center; justify-content: space-between;
}
.status-msg { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status-msg.ok { color: var(--accent-strong); }
.status-msg.err { color: var(--danger); }
.btn-save {
  border: 0; border-radius: 9px; background: var(--accent); color: #fff; padding: 8px 22px;
  font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
  box-shadow: 0 1px 2px rgba(15, 157, 138, .4), 0 4px 12px rgba(15, 157, 138, .22); transition: all .15s;
}
.btn-save:hover { background: var(--accent-strong); }
.btn-save:active { transform: translateY(1px); }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(16, 24, 40, .38); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
.modal-overlay.open { display: flex; }
.modal-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; max-width: 380px; width: 100%; box-shadow: 0 20px 50px rgba(16, 24, 40, .25); display: flex; flex-direction: column; gap: 12px; }
.modal-title { font-size: 15px; font-weight: 700; color: var(--ink); }
.modal-desc { font-size: 13px; color: var(--muted); line-height: 1.55; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- Window Titlebar -->
<div class="window-bar">
  <div class="brand" id="titleDrag">
    <span class="badge">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>
    </span>
    <div class="brand-copy">
      <h1>Aalu — Daily Scheduler</h1>
      <small>Timetable & Reminders · Right Ctrl+Space to toggle</small>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" id="tabCheck" type="button">Checklist</button>
    <button class="tab" id="tabPlan" type="button">Timetable</button>
  </nav>
  <div class="toolbar">
    <button class="window-control" data-window="minimize" title="Minimize" aria-label="Minimize">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <button class="window-control" data-window="maximize" title="Maximize or restore" aria-label="Maximize or restore">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
    </button>
    <button class="window-control close" id="closeWindow" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
  </div>
</div>

<!-- Daily Checklist (default view) -->
<main class="check-view" id="checkView">
  <section class="check-head">
    <div class="head-top">
      <div class="head-title">
        <div class="date-label" id="dateLabel"></div>
        <div class="head-sub"><span id="checkTplName"></span><span id="checkCount"></span></div>
      </div>
      <div class="date-nav">
        <button class="nav-btn icon" id="datePrev" title="Previous day" aria-label="Previous day">‹</button>
        <button class="nav-btn" id="dateToday" title="Jump to today">Today</button>
        <button class="nav-btn icon" id="dateNext" title="Next day" aria-label="Next day">›</button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-pct" id="ringPct">0%</span>
    </div>
  </section>
  <div class="history" id="history"></div>
  <div class="check-list" id="checkList"></div>
</main>

<!-- Main 2-Column Area -->
<main class="main-content view-hidden" id="planView">
  <!-- Left Column: Templates & Schedule Blocks -->
  <section class="pane">
    <div class="pane-title-row">
      <span class="pane-title">Timetable Template</span>
      <div class="btn-group">
        <button class="btn-sm" id="btnNewTpl" title="Create a new template">+ New</button>
        <button class="btn-sm" id="btnRenameTpl" title="Rename current template">Rename</button>
        <button class="btn-sm" id="btnDupTpl" title="Duplicate current template">Duplicate</button>
        <button class="btn-sm danger" id="btnDelTpl" title="Delete current template">Delete</button>
      </div>
    </div>

    <div class="template-picker-row">
      <select id="templateSelect" class="template-select" aria-label="Select Template"></select>
    </div>

    <div class="pane-title-row" style="margin-top: 4px;">
      <span class="pane-title" id="blocksLabel">Schedule Blocks</span>
      <small style="color:var(--muted); font-size:11.5px;" id="blocksCount">0 blocks</small>
    </div>

    <!-- Blocks List -->
    <div class="block-list-container" id="blockList"></div>

    <!-- Add Block Inline -->
    <form class="add-block-row" id="addBlockForm">
      <input type="time" id="newTime" required aria-label="Block time">
      <input type="text" id="newText" placeholder="Block name (e.g. Exercise, Padhai)" maxlength="120" required aria-label="Block text">
      <button class="btn-add" type="submit">+ Add</button>
    </form>
  </section>

  <!-- Right Column: Week Plan -->
  <section class="pane">
    <div class="pane-title-row">
      <span class="pane-title">Week Plan</span>
      <small style="color:var(--muted); font-size:11.5px;">Assign templates to days</small>
    </div>

    <div class="week-rows" id="weekRows"></div>
  </section>
</main>

<!-- Footer Action Bar -->
<footer class="footer-bar">
  <div class="status-msg" id="statusMsg">Loading schedule…</div>
  <button class="btn-save view-hidden" id="btnSave">Save Schedule</button>
</footer>

<!-- Modal Prompt / Confirm -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Confirm</div>
    <div class="modal-desc" id="modalDesc">Are you sure?</div>
    <input type="text" id="modalInput" style="display:none;" maxlength="120">
    <div class="modal-actions">
      <button class="btn-sm" id="modalCancel">Cancel</button>
      <button class="btn-sm danger" id="modalConfirm">Delete</button>
    </div>
  </div>
</div>

<script>
const post = msg => window.ipc?.postMessage(JSON.stringify(msg));

// Window Actions
document.querySelectorAll('[data-window]').forEach(btn => {
  btn.addEventListener('click', () => post({ t: 'window', action: btn.dataset.window }));
});
document.getElementById('closeWindow').addEventListener('click', () => post({ t: 'close' }));
document.getElementById('titleDrag').addEventListener('mousedown', e => {
  if (e.button === 0) post({ t: 'window', action: e.detail === 2 ? 'maximize' : 'drag' });
});

// Escape closes the scheduler; Right Ctrl+Space is handled globally by the native app.
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault();
    post({ t: 'close' });
  }
});

// App State
let schedule = {
  version: 1,
  templates: [],
  week: { mon: null, tue: null, wed: null, thu: null, fri: null, sat: null, sun: null },
  done: {}
};
let activeTemplateId = null;
let activeTab = 'check';
let checkDate = null; // 'YYYY-MM-DD' shown in the checklist; null = today

const DAYS = [
  { key: 'mon', name: 'Monday', idx: 1 },
  { key: 'tue', name: 'Tuesday', idx: 2 },
  { key: 'wed', name: 'Wednesday', idx: 3 },
  { key: 'thu', name: 'Thursday', idx: 4 },
  { key: 'fri', name: 'Friday', idx: 5 },
  { key: 'sat', name: 'Saturday', idx: 6 },
  { key: 'sun', name: 'Sunday', idx: 0 }
];

const currentDayIdx = new Date().getDay(); // 0 = Sunday

// Elements
const tplSelect = document.getElementById('templateSelect');
const blockList = document.getElementById('blockList');
const blocksLabel = document.getElementById('blocksLabel');
const blocksCount = document.getElementById('blocksCount');
const addBlockForm = document.getElementById('addBlockForm');
const newTimeInput = document.getElementById('newTime');
const newTextInput = document.getElementById('newText');
const weekRows = document.getElementById('weekRows');
const statusMsg = document.getElementById('statusMsg');
const btnSave = document.getElementById('btnSave');

// Modal
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalInput = document.getElementById('modalInput');
const modalCancel = document.getElementById('modalCancel');
const modalConfirm = document.getElementById('modalConfirm');
let onModalConfirm = null;

function showModal({ title, desc, inputVal, isPrompt, confirmText, isDanger, onConfirm }) {
  modalTitle.textContent = title;
  modalDesc.textContent = desc;
  modalConfirm.textContent = confirmText || 'OK';
  modalConfirm.className = isDanger ? 'btn-sm danger' : 'btn-sm';
  if (isPrompt) {
    modalInput.style.display = 'block';
    modalInput.value = inputVal || '';
  } else {
    modalInput.style.display = 'none';
  }
  onModalConfirm = () => {
    const val = isPrompt ? modalInput.value.trim() : true;
    closeModal();
    onConfirm(val);
  };
  modalOverlay.classList.add('open');
  if (isPrompt) setTimeout(() => modalInput.focus(), 50);
}

function closeModal() {
  modalOverlay.classList.remove('open');
  onModalConfirm = null;
}
modalCancel.addEventListener('click', closeModal);
modalConfirm.addEventListener('click', () => { if (onModalConfirm) onModalConfirm(); });

// Set default time to next hour
function setNextHourDefault() {
  const d = new Date();
  d.setHours(d.getHours() + 1, 0, 0, 0);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  newTimeInput.value = `${hh}:${mm}`;
}
setNextHourDefault();

// Render Functions
function getActiveTemplate() {
  return schedule.templates.find(t => t.id === activeTemplateId) || null;
}

function renderTemplates() {
  tplSelect.innerHTML = '';
  if (!schedule.templates.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '(No templates — Click + New)';
    tplSelect.appendChild(opt);
    activeTemplateId = null;
  } else {
    if (!activeTemplateId || !schedule.templates.some(t => t.id === activeTemplateId)) {
      activeTemplateId = schedule.templates[0].id;
    }
    for (const t of schedule.templates) {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = `${t.name} (${t.blocks.length} blocks)`;
      if (t.id === activeTemplateId) opt.selected = true;
      tplSelect.appendChild(opt);
    }
  }
  renderBlocks();
  renderWeekPlan();
}

function renderBlocks() {
  blockList.innerHTML = '';
  const current = getActiveTemplate();
  if (!current) {
    blocksLabel.textContent = 'Schedule Blocks';
    blocksCount.textContent = '0 blocks';
    blockList.innerHTML = '<div class="empty-state">Create a template above to add blocks.</div>';
    return;
  }

  blocksLabel.textContent = `Schedule for "${current.name}"`;
  blocksCount.textContent = `${current.blocks.length} block${current.blocks.length === 1 ? '' : 's'}`;

  if (!current.blocks.length) {
    blockList.innerHTML = '<div class="empty-state">No blocks yet. Add your first time block below.</div>';
    return;
  }

  current.blocks.sort((a, b) => a.time.localeCompare(b.time));

  for (let i = 0; i < current.blocks.length; i++) {
    const b = current.blocks[i];
    const row = document.createElement('div');
    row.className = 'block-row';

    const timeSpan = document.createElement('span');
    timeSpan.className = 'block-time';
    timeSpan.textContent = b.time;

    const textSpan = document.createElement('span');
    textSpan.className = 'block-text';
    textSpan.textContent = b.text;

    const delBtn = document.createElement('button');
    delBtn.className = 'block-delete';
    delBtn.title = 'Remove block';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => {
      current.blocks.splice(i, 1);
      renderTemplates();
      setStatus('Unsaved changes');
    });

    row.appendChild(timeSpan);
    row.appendChild(textSpan);
    row.appendChild(delBtn);
    blockList.appendChild(row);
  }
}

function renderWeekPlan() {
  weekRows.innerHTML = '';
  for (const day of DAYS) {
    const card = document.createElement('div');
    card.className = `day-card ${day.idx === currentDayIdx ? 'today' : ''}`;

    const labelGroup = document.createElement('div');
    labelGroup.className = 'day-label-group';

    const dayName = document.createElement('span');
    dayName.className = 'day-name';
    dayName.textContent = day.name;
    labelGroup.appendChild(dayName);

    if (day.idx === currentDayIdx) {
      const badge = document.createElement('span');
      badge.className = 'today-badge';
      badge.textContent = 'Today';
      labelGroup.appendChild(badge);
    }

    const select = document.createElement('select');
    select.className = 'day-select';
    select.setAttribute('aria-label', `Template for ${day.name}`);

    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = 'None';
    select.appendChild(noneOpt);

    for (const t of schedule.templates) {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      select.appendChild(opt);
    }

    select.value = schedule.week[day.key] || '';
    select.addEventListener('change', () => {
      schedule.week[day.key] = select.value || null;
      setStatus('Unsaved changes');
    });

    card.appendChild(labelGroup);
    card.appendChild(select);
    weekRows.appendChild(card);
  }
}

function setStatus(text, type = '') {
  statusMsg.textContent = text;
  statusMsg.className = `status-msg ${type}`;
}

// Template Switching
tplSelect.addEventListener('change', () => {
  activeTemplateId = tplSelect.value;
  renderBlocks();
});

// Create Template
document.getElementById('btnNewTpl').addEventListener('click', () => {
  showModal({
    title: 'New Timetable Template',
    desc: 'Enter a name for this day timetable (e.g. Weekday, Weekend, Gym Day):',
    inputVal: 'My Schedule',
    isPrompt: true,
    confirmText: 'Create',
    onConfirm: name => {
      if (!name) return;
      const id = 't_' + Date.now();
      schedule.templates.push({ id, name, blocks: [] });
      activeTemplateId = id;
      renderTemplates();
      setStatus('Unsaved changes');
    }
  });
});

// Rename Template
document.getElementById('btnRenameTpl').addEventListener('click', () => {
  const current = getActiveTemplate();
  if (!current) return;
  showModal({
    title: 'Rename Template',
    desc: 'Enter a new name for this template:',
    inputVal: current.name,
    isPrompt: true,
    confirmText: 'Rename',
    onConfirm: name => {
      if (!name) return;
      current.name = name;
      renderTemplates();
      setStatus('Unsaved changes');
    }
  });
});

// Duplicate Template
document.getElementById('btnDupTpl').addEventListener('click', () => {
  const current = getActiveTemplate();
  if (!current) return;
  const id = 't_' + Date.now();
  const name = `${current.name} (Copy)`;
  const blocks = current.blocks.map(b => ({ ...b, id: 'b_' + Math.random().toString(36).slice(2, 8) }));
  schedule.templates.push({ id, name, blocks });
  activeTemplateId = id;
  renderTemplates();
  setStatus('Unsaved changes');
});

// Delete Template
document.getElementById('btnDelTpl').addEventListener('click', () => {
  const current = getActiveTemplate();
  if (!current) return;

  const assignedDays = DAYS.filter(d => schedule.week[d.key] === current.id).map(d => d.name);
  const desc = assignedDays.length
    ? `Template "${current.name}" is currently assigned to ${assignedDays.join(', ')}. Deleting it will set those days to None. Continue?`
    : `Are you sure you want to delete template "${current.name}"?`;

  showModal({
    title: 'Delete Template',
    desc,
    confirmText: 'Delete',
    isDanger: true,
    onConfirm: () => {
      for (const d of DAYS) {
        if (schedule.week[d.key] === current.id) {
          schedule.week[d.key] = null;
        }
      }
      schedule.templates = schedule.templates.filter(t => t.id !== current.id);
      activeTemplateId = schedule.templates[0]?.id || null;
      renderTemplates();
      setStatus('Unsaved changes');
    }
  });
});

// Add Block
addBlockForm.addEventListener('submit', e => {
  e.preventDefault();
  const current = getActiveTemplate();
  if (!current) {
    setStatus('Create a template first', 'err');
    return;
  }
  const time = newTimeInput.value;
  const text = newTextInput.value.trim();
  if (!time || !text) return;

  current.blocks.push({
    id: 'b_' + Date.now(),
    time,
    text
  });
  newTextInput.value = '';
  setNextHourDefault();
  renderBlocks();
  renderTemplates();
  setStatus('Unsaved changes');
});

// ================= Daily Checklist =================
const pad2 = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dateKey(new Date());
const checkView = document.getElementById('checkView');
const planView = document.getElementById('planView');
const tabPlan = document.getElementById('tabPlan');
const tabCheck = document.getElementById('tabCheck');
const dateLabel = document.getElementById('dateLabel');
const checkList = document.getElementById('checkList');
const checkTplName = document.getElementById('checkTplName');
const checkCount = document.getElementById('checkCount');
const progressFill = document.getElementById('progressFill');
const historyEl = document.getElementById('history');
const ringPct = document.getElementById('ringPct');
function setProgress(p) {
  progressFill.style.width = p + '%';
  ringPct.textContent = p + '%';
}

function templateForDate(date) {
  const day = DAYS.find(x => x.idx === date.getDay());
  const id = schedule.week[day.key];
  return schedule.templates.find(t => t.id === id) || null;
}
function isDone(key, id) {
  return !!(schedule.done && schedule.done[key] && schedule.done[key].includes(id));
}
function doneCount(key, tpl) {
  return tpl ? tpl.blocks.filter(b => isDone(key, b.id)).length : 0;
}

function toggleDone(key, id, done) {
  if (!schedule.done) schedule.done = {};
  const arr = schedule.done[key] || (schedule.done[key] = []);
  if (done) {
    if (!arr.includes(id)) arr.push(id);
  } else {
    const i = arr.indexOf(id);
    if (i >= 0) arr.splice(i, 1);
    if (!arr.length) delete schedule.done[key];
  }
  post({ t: 'check', date: key, id, done });
  renderChecklist();
}

function renderChecklist() {
  const key = checkDate || todayKey();
  const date = keyToDate(key);
  const isToday = key === todayKey();
  const tpl = templateForDate(date);

  dateLabel.textContent = '';
  dateLabel.append(date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }));
  if (isToday) {
    const badge = document.createElement('span');
    badge.className = 'today-badge';
    badge.textContent = 'Today';
    dateLabel.appendChild(badge);
  }

  checkList.innerHTML = '';
  if (!tpl) {
    const dayName = DAYS.find(x => x.idx === date.getDay()).name;
    checkTplName.textContent = 'No template';
    checkCount.textContent = '';
    setProgress(0);
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = `No template is assigned to ${dayName}. Assign one in the Timetable tab (Week Plan).`;
    checkList.appendChild(empty);
  } else if (!tpl.blocks.length) {
    checkTplName.textContent = tpl.name;
    checkCount.textContent = '0 / 0 done';
    setProgress(0);
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = `"${tpl.name}" has no blocks yet. Add some in the Timetable tab.`;
    checkList.appendChild(empty);
  } else {
    const blocks = [...tpl.blocks].sort((a, b) => a.time.localeCompare(b.time));
    const done = blocks.filter(b => isDone(key, b.id)).length;
    checkTplName.textContent = tpl.name;
    checkCount.textContent = '';
    if (done === blocks.length) {
      checkCount.append('All done \u2728 Great job!');
    } else {
      const strong = document.createElement('b');
      strong.textContent = `${done} / ${blocks.length}`;
      checkCount.append(strong, ' done');
    }
    setProgress(Math.round((done / blocks.length) * 100));

    const nowD = new Date();
    const nowHM = `${pad2(nowD.getHours())}:${pad2(nowD.getMinutes())}`;
    const nextBlock = isToday ? blocks.find(b => !isDone(key, b.id) && b.time >= nowHM) : null;

    for (const b of blocks) {
      const checked = isDone(key, b.id);
      const isNext = nextBlock === b;
      const row = document.createElement('div');
      row.className = 'check-row' + (checked ? ' done' : '') + (isNext ? ' next' : '');
      row.setAttribute('role', 'checkbox');
      row.setAttribute('aria-checked', String(checked));

      const box = document.createElement('span');
      box.className = 'check-box';
      box.textContent = checked ? '✓' : '';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'block-time';
      timeSpan.textContent = b.time;

      const textSpan = document.createElement('span');
      textSpan.className = 'block-text';
      textSpan.textContent = b.text;

      row.append(box, timeSpan, textSpan);
      if (isNext) {
        const tag = document.createElement('span');
        tag.className = 'next-tag';
        tag.textContent = 'Next';
        row.appendChild(tag);
      }
      row.addEventListener('click', () => toggleDone(key, b.id, !checked));
      checkList.appendChild(row);
    }
  }

  // Last 7 days strip (ending today), click to jump
  historyEl.innerHTML = '';
  const today = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
    const k = dateKey(d);
    const t = templateForDate(d);
    const total = t ? t.blocks.length : 0;
    const n = doneCount(k, t);
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'hist-chip' + (k === key ? ' active' : '') + (total > 0 && n === total ? ' full' : '');
    const top = document.createElement('b');
    top.textContent = d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + d.getDate();
    chip.append(top, total ? `${n}/${total}` : '–');
    chip.addEventListener('click', () => { checkDate = k; renderChecklist(); });
    historyEl.appendChild(chip);
  }
}

function shiftCheckDate(days) {
  const d = keyToDate(checkDate || todayKey());
  d.setDate(d.getDate() + days);
  checkDate = dateKey(d);
  renderChecklist();
}
document.getElementById('datePrev').addEventListener('click', () => shiftCheckDate(-1));
document.getElementById('dateNext').addEventListener('click', () => shiftCheckDate(1));
document.getElementById('dateToday').addEventListener('click', () => { checkDate = null; renderChecklist(); });

function setTab(tab) {
  activeTab = tab;
  const isCheck = tab === 'check';
  tabPlan.classList.toggle('active', !isCheck);
  tabCheck.classList.toggle('active', isCheck);
  planView.classList.toggle('view-hidden', isCheck);
  checkView.classList.toggle('view-hidden', !isCheck);
  btnSave.classList.toggle('view-hidden', isCheck);
  if (isCheck) renderChecklist();
}
tabPlan.addEventListener('click', () => setTab('plan'));
tabCheck.addEventListener('click', () => { checkDate = null; setTab('check'); });

// Save Schedule
btnSave.addEventListener('click', () => {
  setStatus('Saving schedule…');
  post({ t: 'save', data: schedule });
});

// Window IPC Bridge
window.__sched = {
  load(data) {
    schedule = data || {
      version: 1,
      templates: [],
      week: { mon: null, tue: null, wed: null, thu: null, fri: null, sat: null, sun: null }
    };
    if (!schedule.done) schedule.done = {};
    renderTemplates();
    if (activeTab === 'check') renderChecklist();
    setStatus('Schedule loaded', 'ok');
  },
  checkResult(ok, errorMsg) {
    if (!ok) {
      setStatus(`Could not save checklist: ${errorMsg || 'Unknown error'}`, 'err');
    } else if (statusMsg.textContent !== 'Unsaved changes') {
      setStatus('Checklist saved', 'ok');
    }
  },
  saveResult(ok, errorMsg) {
    if (ok) {
      setStatus('Saved! Takes effect immediately.', 'ok');
    } else {
      setStatus(`Failed to save: ${errorMsg || 'Unknown error'}`, 'err');
    }
  }
};

// Initial Load Request
post({ t: 'load' });
</script>
</body>
</html>
