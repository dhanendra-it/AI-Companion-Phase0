name: Windows build checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Cargo check and tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js for toolbar script validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Personal Toolbar JavaScript
        shell: pwsh
        run: |
          $html = Get-Content "assets/personal-toolbar.html" -Raw
          $match = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (-not $match.Success) { throw "Personal Toolbar script tag was not found" }
          $scriptPath = Join-Path $env:RUNNER_TEMP "personal-toolbar.js"
          Set-Content -Path $scriptPath -Value $match.Groups[1].Value -Encoding utf8
          node --check $scriptPath

      - name: Install toolbar test dependency
        run: npm install --no-save --no-package-lock jsdom@26

      - name: Run Personal Toolbar interaction tests
        run: node --test tests/personal-toolbar.test.cjs

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check release build
        run: cargo check --locked --release

      - name: Run Rust tests
        run: cargo test --locked
